# VKD3D-Proton custom fork template
#
# This project uses a custom VKD3D-Proton fork that supports global mip LOD bias
# through VKD3D_GLOBAL_MIP_LOD_BIAS.
#
# Recommended defaults:
VKD3D_GLOBAL_MIP_LOD_BIAS=0.0
# VKD3D_DEBUG=none
# VKD3D_CONFIG=
# VKD3D_FRAME_RATE=0
# VKD3D_SHADER_CACHE_PATH=
# VKD3D_SWAPCHAIN_PRESENT_MODE=
# VKD3D_VULKAN_DEVICE=
# VKD3D_FILTER_DEVICE_NAME=
# VKD3D_DISABLE_EXTENSIONS=
#
# Positive values: less detail / more aggressive mip selection.
# Negative values: more detail / sharper textures.
